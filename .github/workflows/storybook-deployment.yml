name: Storybook Deployment

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'package-lock.json'
      - '.github/workflows/storybook-deployment.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: storybook-deployment
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/code-quality.yml
    permissions:
      contents: read

  publish:
    needs: quality
    uses: ultimatelemon/shared-actions/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/ultimatelemon/ui-storybook
      dockerfile: packages/ui/Dockerfile

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: publish
    permissions:
      contents: read
    uses: ultimatelemon/shared-actions/.github/workflows/dokploy-deploy.yml@v1
    with:
      url: https://ui.ultimatelemon.eu
    secrets:
      webhook-url: ${{ secrets.DOKPLOY_STORYBOOK_DEPLOY_URL }}
